<script>

const $=(selector,root=document)=>root.querySelector(selector);

{id:1,name:'Бюстгальтер Lace',category:'bras',price:3990,img:photo(9532134),images:[photo(9532134),photo(8732111),photo(12010644)],colors:['sand','coffee','cream'],sizes:['70B','75B','75C','80B','80C'],type:'Кружево',tag:'Новинка'},
{id:2,name:'Комплект Noir',category:'sets',price:5490,img:photo(7886225),images:[photo(7886225),photo(6833957),photo(6828383)],colors:['black','coffee'],sizes:['S','M','L'],type:'Кружево',tag:'Популярное'},
{id:3,name:'Бюстгальтер Comfort',category:'bras',price:3490,img:photo(8732111),images:[photo(8732111),photo(9456698)],colors:['rose','sand','cream'],sizes:['70B','75B','75C','80C'],type:'Повседневное',tag:''},
{id:4,name:'Боди Élise',category:'bodysuits',price:4990,img:photo(6828383),images:[photo(6828383),photo(7886225)],colors:['black','coffee'],sizes:['XS','S','M','L'],type:'Кружево',tag:''},

{id:7,name:'Бюстгальтер Soft',category:'bras',price:3290,img:photo(13048811),images:[photo(13048811),photo(9532134)],colors:['sand','cream'],sizes:['70A','75A','75B','80B'],type:'Повседневное',tag:''},
{id:8,name:'Комплект Muse',category:'sets',price:6190,img:photo(6833957),images:[photo(6833957),photo(7886225)],colors:['black','wine'],sizes:['S','M','L'],type:'Кружево',tag:''},
{id:9,name:'Боди Silhouette',category:'bodysuits',price:5590,img:photo(4041294),images:[photo(4041294),photo(6828383)],colors:['black','sand'],sizes:['XS','S','M','L'],type:'Кружево',tag:''},

{id:12,name:'Домашний комплект Air',category:'home',price:4290,img:photo(12010644),images:[photo(12010644),photo(9456698)],colors:['sand','cream'],sizes:['S','M','L'],type:'Домашняя одежда',tag:''}
];
const fmt=n=>`${Number(n).toLocaleString('ru-RU')} ₽`;
const icon=(name,size=22)=>{const common='viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"';const paths={menu:'<path d="M3 6h18M3 12h18M3 18h18"/>',search:'<circle cx="10.8" cy="10.8" r="7.6"/><path d="m16.5 16.5 5 5"/>',heart:'<path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0l-1 1-1-1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.4a5.5 5.5 0 0 0 0-7.8Z"/>',bag:'<path d="M4 8h16l-1 13H5L4 8Z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>',close:'<path d="M5 5l14 14M19 5 5 19"/>',arrow:'<path d="M4 12h16m-7-7 7 7-7 7"/>',back:'<path d="M20 12H4m7 7-7-7 7-7"/>',sliders:'<path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="white"/><circle cx="16" cy="17" r="2" fill="white"/>',truck:'<path d="M3 6h11v11H3zM14 10h4l3 4v3h-7z"/><circle cx="7.5" cy="18" r="2"/><circle cx="17.5" cy="18" r="2"/>',box:'<path d="M3 7 12 3l9 4v10l-9 4-9-4V7Zm0 0 9 4 9-4m-9 4v10"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.1a2.8 2.8 0 1 1 4.1 2.4c-1 .6-1.6 1.2-1.6 2.2M12 17h.01"/>',rotate:'<path d="M4 11a8 8 0 1 1 3 7M4 18v-7h7"/>',check:'<path d="M4 12l5 5L20 6"/>',gift:'<rect x="3" y="8" width="18" height="13"/><path d="M12 8v13M2 8h20M12 8C8 8 6 5 8 3s4 2 4 5Zm0 0c4 0 6-3 4-5s-4 2-4 5Z"/>',shield:'<path d="m12 2 9 4v6c0 6-4 9-9 10-5-1-9-4-9-10V6z"/><path d="m8 12 3 3 5-6"/>'};return `<svg width="${size}" height="${size}" class="ico" ${common} stroke-width="1.7" aria-hidden="true">${paths[name]||paths.arrow}</svg>`};
const read=(k,fallback)=>{try{return JSON.parse(localStorage.getItem(k))??fallback}catch{return fallback}};
const state={cart:read('eva-cart',[]),likes:read('eva-likes',[]),category:'all',size:'',color:'',sort:'popular',query:'',searchDraft:'',tab:'all',productColor:null,productSize:null,shipping:'courier'};
const save=()=>{try{localStorage.setItem('eva-cart',JSON.stringify(state.cart));localStorage.setItem('eva-likes',JSON.stringify(state.likes))}catch{}};
const cartCount=()=>state.cart.reduce((n,c)=>n+c.qty,0),cartTotal=()=>state.cart.reduce((n,c)=>n+c.qty*(PRODUCTS.find(p=>p.id===c.id)?.price||0),0);
const href=(route)=>`#/${route}`;
const photoTag=(url,alt='',priority=false)=>`<img src="${url}" alt="${alt}" loading="${priority?'eager':'lazy'}" ${priority?'fetchpriority="high"':''} referrerpolicy="no-referrer"/>`;
const head=()=>`<div class="topline">EVA · Демо-концепция интернет-магазина</div><header class="site-header"><div class="header-in"><button type="button" class="icon-btn mobile-menu-btn" data-action="menu" aria-label="Открыть меню">${icon('menu')}</button><a class="brand" href="#/" aria-label="EVA — на главную">EVA</a><nav class="header-nav" aria-label="Основное меню"><a href="#/catalog">Каталог</a><a href="#/catalog?new=1">Новинки</a><a href="#/catalog?category=sets">Комплекты</a><a href="#/catalog?category=bras">Бюстгальтеры</a><a href="#/catalog?category=bodysuits">Боди</a></nav><form class="header-search" id="header-search">${icon('search',18)}<input name="q" type="search" placeholder="Поиск по каталогу" aria-label="Поиск товаров"></form><div class="header-actions"><button class="icon-btn" data-action="search" aria-label="Поиск">${icon('search')}</button><a class="icon-btn" href="#/favorites" aria-label="Избранное">${icon('heart')}</a><a class="icon-btn profile-icon" href="#/checkout" aria-label="Оформление">${icon('user')}</a><a class="icon-btn" href="#/cart" aria-label="Корзина">${icon('bag')}${cartCount()?`<span class="count-bubble">${cartCount()}</span>`:''}</a></div></div></header>`;
const foot=()=>`<footer class="footer"><div class="shell"><div class="footer-row"><div class="footer-brand"><h2>EVA</h2><p class="subtitle">Бельё, которое хочется выбирать.</p><small>Временное название и демонстрационная концепция магазина.</small></div><div class="footer-links"><div><strong>Покупателям</strong><a href="#/catalog">Каталог</a><a href="#/cart">Корзина</a><a href="#/favorites">Избранное</a></div><div><strong>Выбор</strong><a href="#/catalog?category=bras">Бюстгальтеры</a><a href="#/catalog?category=panties">Трусики</a><a href="#/catalog?category=sets">Комплекты</a></div><div><strong>Информация</strong><a href="#/info">О проекте</a><a href="#/info">Доставка и возврат</a><a href="#/info">Контакты</a></div></div></div><div class="footer-line"><span>© 2026 EVA · Дизайн-прототип</span><span>Фото и цены демонстрационные. Заказы и платежи отключены.</span></div></div></footer>`;
const productCard=(p)=>`<article class="product-card"><div class="product-photo" data-action="product" data-id="${p.id}" role="link" tabindex="0" aria-label="${p.name}">${photoTag(p.img,p.name)}<button type="button" class="wish ${state.likes.includes(p.id)?'selected':''}" data-action="like" data-id="${p.id}" aria-label="${state.likes.includes(p.id)?'Убрать из избранного':'В избранное'}">${icon('heart',18)}</button></div><div class="product-meta"><a class="product-name" href="#/product/${p.id}">${p.name}</a><div class="product-price">${fmt(p.price)}</div><div class="swatches">${p.colors.slice(0,4).map((c,i)=>`<span class="swatch ${i===0?'active':''}" title="${c}"><i style="background:${COLORS[c]}"></i></span>`).join('')}</div></div></article>`;
const titleRow=(title,where='catalog',linkText='Смотреть все')=>`<div class="section-head"><h2 class="section-title">${title}</h2><a class="link-arrow" href="#/${where}">${linkText} ${icon('arrow')}</a></div>`;
function home(){return `${head()}<main>
<section class="hero screen-section"><div class="hero-media">${photoTag(IMG.hero,'Кампания EVA — демонстрационная фотография',true)}</div><div class="shell hero-content"><div class="eyebrow">Новая коллекция</div><h1>Женственность<br>в каждой детали</h1><p>Красота привычных моментов. Откройте коллекцию белья для себя.</p><a class="btn" href="#/catalog">Перейти в каталог ${icon('arrow')}</a><div class="hero-pagination"><span></span><span></span><span></span></div></div></section>
<section class="content-section screen-section" id="categories"><div class="shell">${titleRow('Категории')}<div class="category-grid">${CATEGORIES.map(c=>`<a href="#/catalog?category=${c.id}" class="category-card ${c.id==='home'?'wide':''}"><div class="category-picture">${photoTag(c.image,c.name)}</div><div class="category-info"><span>${c.name}</span><span class="circle-arr">${icon('arrow')}</span></div></a>`).join('')}</div></div></section>
<section class="content-section screen-section" id="popular"><div class="shell">${titleRow('Популярное')}<div class="tab-list" role="tablist">${[['all','Все'],['bras','Бюстгальтеры'],['sets','Комплекты'],['panties','Трусики'],['bodysuits','Боди']].map(([a,b])=>`<button type="button" class="tab ${state.tab===a?'active':''}" role="tab" aria-selected="${state.tab===a}" data-action="tab" data-value="${a}">${b}</button>`).join('')}</div><div class="product-grid" id="home-products">${PRODUCTS.filter(p=>state.tab==='all'||state.tab===p.category).slice(0,4).map(productCard).join('')}</div></div></section>
<section class="collection screen-section"><img src="${IMG.collection}" alt="Кружевной комплект в естественном освещении" loading="lazy"><div class="shell collection-content"><div class="eyebrow">Подборка EVA</div><h2>Собери свой<br>идеальный<br>комплект</h2><p>Бюстгальтеры и трусики, которые хочется сочетать. Выбирайте то, что подходит именно вам.</p><a class="btn" href="#/catalog?category=sets">Смотреть комплекты ${icon('arrow')}</a></div></section>
<section class="content-section values screen-section"><div class="shell"><div class="values-intro"><div class="eyebrow">Важное о покупке</div><h2 class="section-title" style="margin:14px 0 20px">Выбирайте<br>с уверенностью</h2><p>Всё необходимое для выбора и оформления заказа — без лишних шагов.</p></div><div class="values-grid"><div class="value-cell"><div class="value-icon">${icon('truck')}</div><h3>Доставка</h3><p>Способ и условия уточняются при оформлении.</p></div><div class="value-cell"><div class="value-icon">${icon('help')}</div><h3>Выбор размера</h3><p>Размеры моделей указаны в карточках товаров.</p></div><div class="value-cell"><div class="value-icon">${icon('rotate')}</div><h3>Возврат</h3><p>Условия появятся после согласования с магазином.</p></div><div class="value-cell"><div class="value-icon">${icon('heart')}</div><h3>Избранное</h3><p>Сохраняйте понравившиеся модели в один клик.</p></div></div></div></section></main>${foot()}`}
const getFilterOpts=()=>[['bras','Бюстгальтеры'],['panties','Трусики'],['sets','Комплекты'],['bodysuits','Боди'],['home','Домашняя одежда']];
const filterMarkup=()=>`<div class="filter-group"><strong>Категория</strong>${getFilterOpts().map(([id,name])=>`<label class="filter-row"><input type="radio" name="cat" value="${id}" ${state.category===id?'checked':''} data-action="set-category"/>${name}</label>`).join('')}<label class="filter-row"><input type="radio" name="cat" value="all" ${state.category==='all'?'checked':''} data-action="set-category"/>Все товары</label></div><div class="filter-group"><strong>Размер</strong><div class="filter-size-list">${['XS','S','M','L','70B','75B','75C','80B'].map(s=>`<button class="size-chip ${s===state.size?'selected':''}" data-action="filter-size" data-value="${s}" type="button">${s}</button>`).join('')}</div></div><div class="filter-group"><strong>Цвет</strong><div class="filter-colors">${Object.entries(COLORS).map(([c,hex])=>`<button class="${state.color===c?'selected':''}" data-action="filter-color" data-value="${c}" aria-label="Цвет: ${c}" title="${c}"><i style="background:${hex}"></i></button>`).join('')}</div></div><div class="filter-group"><strong>Наличие и стоимость</strong><p style="font-size:12px;color:var(--muted)">Все демонстрационные позиции доступны для просмотра. Цены примерные.</p></div><button class="btn btn-outline btn-block" type="button" data-action="clear-filter">Сбросить фильтры</button>`;
const filteredProducts=()=>{let p=PRODUCTS.filter(p=>(state.category==='all'||p.category===state.category)&&(!state.size||p.sizes.includes(state.size))&&(!state.color||p.colors.includes(state.color))&&(!state.query||p.name.toLowerCase().includes(state.query.toLowerCase())));if(state.sort==='price-up')p.sort((a,b)=>a.price-b.price);if(state.sort==='price-down')p.sort((a,b)=>b.price-a.price);return p};
function catalog(){const p=filteredProducts();const catName=CATEGORIES.find(c=>c.id===state.category)?.name||'Весь каталог';return `${head()}<main class="shell"><div class="page-top"><div class="crumb"><a href="#/">Главная</a> / Каталог</div><h1 class="page-title">${catName}</h1><div class="page-info">${p.length} товаров · демо-ассортимент</div></div><div class="catalog-layout"><aside class="catalog-sidebar">${filterMarkup()}</aside><div><div class="catalog-controls"><div class="cat-pills"><button class="cat-pill ${state.category==='all'?'active':''}" data-action="set-category" data-value="all">Все</button>${getFilterOpts().map(([id,name])=>`<button class="cat-pill ${state.category===id?'active':''}" data-action="set-category" data-value="${id}">${name}</button>`).join('')}</div><div class="catalog-toolbar"><button class="filter-button" data-action="filters">${icon('sliders')} Фильтры ${state.size||state.color?'•':''}</button><label class="sr-only" for="sort">Сортировка</label><select class="select" id="sort" data-action="sort"><option value="popular" ${state.sort==='popular'?'selected':''}>По популярности</option><option value="price-up" ${state.sort==='price-up'?'selected':''}>Сначала дешевле</option><option value="price-down" ${state.sort==='price-down'?'selected':''}>Сначала дороже</option></select></div></div><div class="product-grid catalog-products">${p.length?p.map(productCard).join(''):`<div class="empty-state"><h2>Нет подходящих товаров</h2><p>Попробуйте убрать часть фильтров.</p><button class="btn" data-action="clear-filter">Сбросить фильтры</button></div>`}</div></div></div></main>${foot()}`}
function product(id){const p=PRODUCTS.find(p=>p.id===Number(id));if(!p)return notFound();const color=state.productColor&&p.colors.includes(state.productColor)?state.productColor:p.colors[0];const size=state.productSize&&p.sizes.includes(state.productSize)?state.productSize:null;return `${head()}<main><div class="shell"><div class="page-top"><div class="crumb"><a href="#/">Главная</a> / <a href="#/catalog?category=${p.category}">${CATEGORIES.find(c=>c.id===p.category)?.name}</a> / ${p.name}</div></div><div class="product-layout"><div class="gallery">${p.images.concat(p.images).slice(0,4).map(i=>photoTag(i,p.name)).join('')}</div><div class="product-mobile-gallery">${photoTag(p.img,p.name,true)}<div class="gallery-dots"><i></i><i></i><i></i></div></div><section class="product-purchase"><div class="eyebrow">EVA / Коллекция</div><h1>${p.name}</h1><div class="subtitle">Демонстрационная карточка · ${p.type}</div><div class="big-price">${fmt(p.price)}</div><div class="field-label"><strong>Цвет: ${color==='sand'?'бежевый':color==='coffee'?'кофейный':color==='rose'?'пудровый':color==='cream'?'молочный':color==='black'?'чёрный':'бордовый'}</strong></div><div class="color-row">${p.colors.map(c=>`<button class="color-choice ${color===c?'selected':''}" aria-label="Цвет ${c}" data-action="product-color" data-value="${c}"><i style="background:${COLORS[c]}"></i></button>`).join('')}</div><div class="field-label"><strong>Размер ${size?'· '+size:''}</strong><a href="#/info">Таблица размеров</a></div><div class="sizes-row">${p.sizes.map(s=>`<button class="size-chip ${size===s?'selected':''}" data-action="product-size" data-value="${s}">${s}</button>`).join('')}</div><div class="buy-row"><button class="btn" data-action="add" data-id="${p.id}">Добавить в корзину ${icon('bag')}</button><button class="btn btn-outline" data-action="like" data-id="${p.id}" aria-label="Избранное">${icon('heart')}</button></div><div class="product-accordion"><details class="details" open><summary>Описание</summary><p>Демонстрационная модель для предварительной оценки дизайна магазина. Состав, свойства и характеристики будут заполнены по данным реального товара.</p></details><details class="details"><summary>Размер и посадка</summary><p>Точные параметры и рекомендации по выбору размера добавляются после получения размерной сетки бренда.</p></details><details class="details"><summary>Доставка и возврат</summary><p>Способы доставки, стоимость и условия возврата будут указаны после согласования.</p></details></div></section></div></div><div class="mobile-purchase"><span style="font-weight:600">${fmt(p.price)}</span><button class="btn" data-action="add" data-id="${p.id}">В корзину ${icon('bag')}</button></div></main>${foot()}`}
function cart(){return `${head()}<main class="shell"><div class="page-top"><div class="crumb"><a href="#/">Главная</a> / Корзина</div><h1 class="page-title">Корзина <span style="color:var(--soft);font-size:.55em">(${cartCount()})</span></h1></div>${state.cart.length?`<div class="cart-layout"><div>${state.cart.map((c,i)=>{const p=PRODUCTS.find(p=>p.id===c.id);return `<article class="cart-row">${photoTag(p.img,p.name)}<div><a href="#/product/${p.id}"><h3>${p.name}</h3></a><p>Цвет: ${c.color} · размер: ${c.size}</p><div class="qty-control"><button data-action="qty" data-index="${i}" data-value="-1" aria-label="Меньше">−</button><span>${c.qty}</span><button data-action="qty" data-index="${i}" data-value="1" aria-label="Больше">+</button></div></div><div class="cart-right"><strong>${fmt(p.price*c.qty)}</strong><br><button class="remove" data-action="remove" data-index="${i}">Удалить</button></div></article>`}).join('')}</div><aside class="summary-box"><h2>Ваш заказ</h2><div class="summary-line"><span>Товары (${cartCount()})</span><strong>${fmt(cartTotal())}</strong></div><div class="summary-line"><span>Доставка</span><span>Уточняется</span></div><div class="summary-line total"><span>Итого</span><span>${fmt(cartTotal())}</span></div><p class="summary-sub">Демонстрационная корзина. Оплата на сайте пока не подключена.</p><a class="btn btn-block" href="#/checkout">К оформлению ${icon('arrow')}</a></aside></div>`:`<div class="empty-state" style="min-height:55vh"><h2>Корзина пока пуста</h2><p>Начните с коллекций, которые вам нравятся.</p><a class="btn" href="#/catalog">В каталог ${icon('arrow')}</a></div>`}</main>${foot()}`}
function checkout(){if(!state.cart.length)return cart();return `${head()}<main class="shell"><div class="page-top"><div class="crumb"><a href="#/cart">Корзина</a> / Оформление заказа</div><h1 class="page-title">Оформление</h1><div class="page-info">Демонстрационный сценарий, без отправки заказа и списания денег.</div></div><div class="checkout-layout"><form class="checkout-form" id="checkout-form"><div class="form-section"><h2>01. Контактные данные</h2><div class="input-grid"><label class="field"><span>Имя *</span><input name="name" required minlength="2" autocomplete="given-name" placeholder="Ваше имя"></label><label class="field"><span>Телефон *</span><input name="phone" required inputmode="tel" autocomplete="tel" placeholder="+7 999 123-45-67"></label></div><label class="field"><span>Электронная почта</span><input name="email" type="email" autocomplete="email" placeholder="example@mail.ru"></label></div><div class="form-section"><h2>02. Способ доставки</h2><div class="shipping-options"><label class="option ${state.shipping==='courier'?'selected':''}"><input type="radio" name="shipping" value="courier" ${state.shipping==='courier'?'checked':''}><span><span class="option-title">Курьером</span><small>Стоимость и сроки после подключения службы доставки</small></span></label><label class="option ${state.shipping==='pickup'?'selected':''}"><input type="radio" name="shipping" value="pickup" ${state.shipping==='pickup'?'checked':''}><span><span class="option-title">Пункт выдачи</span><small>Выбор ПВЗ появится после интеграции</small></span></label></div><div class="input-grid" style="margin-top:18px"><label class="field"><span>Город *</span><input name="city" autocomplete="address-level2" placeholder="Город" required></label><label class="field"><span>Адрес или пункт выдачи *</span><input name="address" autocomplete="street-address" placeholder="Улица, дом или адрес ПВЗ" required></label></div></div><div class="form-section"><h2>03. Оплата</h2><div class="notice">Онлайн-оплата пока не подключена. Эта форма предназначена только для проверки дизайна и сценария оформления.</div><button class="btn btn-block" type="submit">Проверить заполнение ${icon('arrow')}</button></div></form><aside class="checkout-aside"><h2 style="font:normal 29px var(--serif);margin:0 0 20px">Ваш заказ</h2>${state.cart.map(c=>{const p=PRODUCTS.find(p=>p.id===c.id);return `<div class="small-cart-item">${photoTag(p.img,p.name)}<div><span>${p.name} × ${c.qty}</span><small>${c.size} · ${c.color}</small><strong>${fmt(p.price*c.qty)}</strong></div></div>`}).join('')}<div class="summary-line total"><span>Итого</span><span>${fmt(cartTotal())}</span></div><p class="summary-sub">Стоимость доставки не включена.</p></aside></div></main>${foot()}`}
function favorites(){const p=PRODUCTS.filter(p=>state.likes.includes(p.id));return `${head()}<main class="shell"><div class="page-top"><div class="crumb"><a href="#/">Главная</a> / Избранное</div><h1 class="page-title">Избранное</h1></div>${p.length?`<div class="product-grid" style="padding:15px 0 90px">${p.map(productCard).join('')}</div>`:`<div class="empty-state" style="min-height:55vh"><h2>Здесь пока ничего нет</h2><p>Нажимайте на сердечко в карточках, чтобы сохранять товары.</p><a class="btn" href="#/catalog">Смотреть каталог</a></div>`}</main>${foot()}`}
function info(){return `${head()}<main class="shell" style="min-height:65vh;padding:50px 0"><div class="eyebrow">Информация</div><h1 class="page-title">О проекте EVA</h1><p style="max-width:620px;color:var(--muted)">Это первая работающая версия дизайна онлайн-магазина женского белья. Название EVA временное. Каталог, изображения товаров и цены используются для демонстрации интерфейса; они не описывают фактически доступные товары. Реальные условия доставки, оплаты, возврата и контакты будут добавлены после получения данных от владельца магазина.</p><a href="#/catalog" class="btn" style="margin-top:24px">Смотреть каталог</a></main>${foot()}`}
function notFound(){return `${head()}<main class="shell empty-state" style="min-height:55vh"><h1>Страница не найдена</h1><a class="btn" href="#/">На главную</a></main>${foot()}`}
function route({scroll=true}={}){const path=location.hash.replace(/^#\/?/,'')||'', [name,param='']=path.split('?');const query=new URLSearchParams(param);let html;let productId;if(name===''||name==='home')html=home();else if(name==='catalog'){state.category=query.get('category')||state.category||'all';if(!CATEGORIES.some(c=>c.id===state.category))state.category='all';html=catalog()}else if(name.startsWith('product/')){productId=Number(name.split('/')[1]);html=product(productId)}else if(name==='cart')html=cart();else if(name==='checkout')html=checkout();else if(name==='favorites')html=favorites();else if(name==='info')html=info();else html=notFound();$('#app').innerHTML=html;document.title=(name?({'catalog':'Каталог','cart':'Корзина','checkout':'Оформление','favorites':'Избранное'}[name]||'Товар')+' — ':'')+'EVA';if(scroll)window.scrollTo({top:0,behavior:'instant'})}
function toast(msg){$('.toast')?.remove();const div=document.createElement('div');div.className='toast';div.setAttribute('role','status');div.textContent=msg;document.body.append(div);setTimeout(()=>div.remove(),2700)}
function openModal(content){$('#modal-root').innerHTML=`<div class="overlay" data-action="overlay"><div class="drawer" role="dialog" aria-modal="true">${content}</div></div>`;document.body.classList.add('lock');$('.drawer-close')?.focus()}
function closeModal(){$('#modal-root').innerHTML='';document.body.classList.remove('lock')}
const modalHead=t=>`<div class="drawer-head"><h2>${t}</h2><button class="drawer-close" data-action="close" aria-label="Закрыть">×</button></div>`;
function addItem(id){const p=PRODUCTS.find(p=>p.id===Number(id));if(!p)return;const size=state.productSize;if(!size||!p.sizes.includes(size)){toast('Сначала выберите размер');$('.sizes-row')?.scrollIntoView({behavior:'smooth',block:'center'});return}const color=state.productColor&&p.colors.includes(state.productColor)?state.productColor:p.colors[0];const existing=state.cart.find(c=>c.id===p.id&&c.size===size&&c.color===color);if(existing)existing.qty++;else state.cart.push({id:p.id,size,color,qty:1});save();toast('Товар добавлен в корзину');route({scroll:false})}
function handleAction(el,e){const a=el.dataset.action,id=Number(el.dataset.id),v=el.dataset.value;if(a==='product'){if(e.target.closest('.wish'))return;location.hash=href('product/'+id);return}if(a==='menu'){openModal(`${modalHead('Меню')}<nav class="drawer-menu">${[['Каталог','catalog'],['Бюстгальтеры','catalog?category=bras'],['Трусики','catalog?category=panties'],['Комплекты','catalog?category=sets'],['Боди','catalog?category=bodysuits'],['Избранное','favorites'],['Корзина','cart']].map(([title,to])=>`<a href="#/${to}" data-action="close-navigate">${title}${icon('arrow')}</a>`).join('')}</nav>`);return}if(a==='search'){openModal(`${modalHead('Поиск')}<form id="search-form"><div class="search-box">${icon('search')}<input name="q" type="search" placeholder="Название товара" required autocomplete="off"/></div><button class="btn btn-block" type="submit">Найти товары</button></form>`);$('.search-box input')?.focus();return}if(a==='filters'){openModal(`${modalHead('Фильтры')}${filterMarkup()}<div class="drawer-foot"><button class="btn btn-block" data-action="close">Показать товары (${filteredProducts().length})</button></div>`);return}if(a==='close'){closeModal();return}if(a==='close-navigate'){closeModal();return}if(a==='overlay'&&e.target===el){closeModal();return}if(a==='tab'){state.tab=v;const anchor=$('#popular')?.getBoundingClientRect().top+window.scrollY;route({scroll:false});window.scrollTo({top:anchor,behavior:'instant'});return}if(a==='set-category'){state.category=v||el.value||'all';state.query='';if(location.hash.startsWith('#/catalog')){history.replaceState(null,'',href('catalog?category='+state.category));route({scroll:false})}else location.hash=href('catalog?category='+state.category);if($('.overlay')){closeModal()}return}if(a==='filter-size'){state.size=state.size===v?'':v;route({scroll:false});if($('.overlay')){openModal(`${modalHead('Фильтры')}${filterMarkup()}<div class="drawer-foot"><button class="btn btn-block" data-action="close">Показать товары (${filteredProducts().length})</button></div>`)}return}if(a==='filter-color'){state.color=state.color===v?'':v;route({scroll:false});if($('.overlay')){openModal(`${modalHead('Фильтры')}${filterMarkup()}<div class="drawer-foot"><button class="btn btn-block" data-action="close">Показать товары (${filteredProducts().length})</button></div>`)}return}if(a==='clear-filter'){state.category='all';state.color='';state.size='';state.query='';location.hash=href('catalog?category=all');route({scroll:false});closeModal();return}if(a==='like'){e.stopPropagation();const i=state.likes.indexOf(id);if(i===-1)state.likes.push(id);else state.likes.splice(i,1);save();route({scroll:false});return}if(a==='product-color'){state.productColor=v;route({scroll:false});return}if(a==='product-size'){state.productSize=v;route({scroll:false});return}if(a==='add'){addItem(id);return}if(a==='qty'){const i=+el.dataset.index,step=+v;if(!state.cart[i])return;state.cart[i].qty=Math.max(0,state.cart[i].qty+step);state.cart=state.cart.filter(x=>x.qty>0);save();route({scroll:false});return}if(a==='remove'){state.cart.splice(+el.dataset.index,1);save();route({scroll:false})}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el,e)});
document.addEventListener('change',e=>{if(e.target.dataset.action==='sort'){state.sort=e.target.value;route({scroll:false})}if(e.target.name==='shipping'){state.shipping=e.target.value;$$('.option').forEach(o=>o.classList.toggle('selected',o.querySelector('input')?.checked))}});
document.addEventListener('submit',e=>{if(e.target.id==='header-search'||e.target.id==='search-form'){e.preventDefault();const q=new FormData(e.target).get('q')?.toString().trim()||'';state.query=q;state.category='all';closeModal();location.hash=href('catalog');route();return}if(e.target.id==='checkout-form'){e.preventDefault();if(e.target.reportValidity())toast('Данные проверены. Реальные заказы пока отключены.')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="link"][data-action="product"]')){e.preventDefault();location.hash=href('product/'+e.target.dataset.id)}});
window.addEventListener('hashchange',()=>{state.productColor=null;state.productSize=null;state.query='';closeModal();route()});
route();

</script>
</body>
</html>
